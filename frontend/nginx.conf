# ==============================================================================
# NGINX — Servidor de la SPA y pasarela hacia la API de Lead Scoring
# ==============================================================================

# Compresión. El bundle de React y las respuestas JSON del listado de prospectos son
# texto muy repetitivo: comprimirlas recorta el tráfico de forma notable en conexiones
# lentas. Se excluyen imágenes y fuentes, que ya vienen comprimidas y solo gastarían CPU.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

# ==============================================================================
# De quién es cada petición que entra por la puerta estrecha (capítulo 34)
# ==============================================================================
# Detrás del túnel, `$remote_addr` es SIEMPRE el proceso `cloudflared` que corre en esta
# misma máquina. Si la IP del cliente se resolviera así, los mil visitantes de un post
# compartirían un solo contador: el tope por IP de la página de interés —que es la única
# defensa contra un envío en bucle— dejaría de existir sin que nada fallara.
#
# La IP real llega en `CF-Connecting-IP`, que pone Cloudflare en su borde y `cloudflared`
# reenvía. Se usa esa cuando viene y `$remote_addr` cuando no, que es el caso de una
# petición local directa al puerto (una prueba, una comprobación de salud).
#
# Creer una cabecera es exactamente lo que `app/core/proxy.py` advierte que no se debe
# hacer, así que hay que decir por qué aquí sí: el puerto de esta puerta **se publica solo
# en `127.0.0.1`** (véase `devops/docker-compose.yml`). Nadie de la red local ni de fuera
# puede conectarse a él para falsear la cabecera; el único que llega es el túnel que corre
# en el propio anfitrión. El día que ese puerto se publique en `0.0.0.0`, esta línea pasa a
# ser un agujero: las dos decisiones van juntas.
map $http_cf_connecting_ip $ip_publica {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Un tope de peticiones en la propia puerta, antes de que el backend trabaje. El de la
# aplicación (`INTERES_LIMITE_*`) sigue estando y cuenta por publicación además de por IP;
# este corta antes, sin tocar la base de datos, que es lo que hace falta en una oleada.
limit_req_zone $ip_publica zone=puerta_publica:1m rate=60r/m;
limit_req_status 429;

# ==============================================================================
# El backend se resuelve EN CADA PETICIÓN, no una vez al arrancar (01-10-2026)
# ==============================================================================
# Encontrado al levantar la pila para el cierre del proyecto. `pila.py up -d --build`
# terminó con éxito y **el panel entero devolvía 502**: todas las llamadas a la API y la
# página pública del túnel. Ni un error en la salida del lanzador.
#
# El motivo: nginx resuelve los nombres de los `proxy_pass` **una sola vez, al arrancar**, y
# se queda con la IP para siempre. Al reconstruir solo el backend, Compose recrea ESE
# contenedor —que entra en la red con una IP nueva— y deja el del cliente como estaba,
# porque su imagen no cambió. nginx siguió llamando a la IP de antes, que ya no era de
# nadie: `connect() failed (111: Connection refused)`.
#
# Es la peor forma del fallo porque **se arregla solo al reiniciar el cliente**, así que
# quien lo sufre no lo reproduce y acaba creyendo que fue cosa de un momento. Y aparece
# justo después de desplegar un cambio del backend, que es cuando menos se quiere dudar.
#
# `127.0.0.11` es el DNS interno de Docker, el mismo que usa cualquier contenedor de la red.
# `valid=10s` acota cuánto puede quedarse atrás. Y la clave está en la otra mitad: un
# `proxy_pass` con una VARIABLE dentro obliga a nginx a resolver en cada petición; con el
# nombre escrito literalmente, el `resolver` ni se mira.
#
# Las cinco pasarelas usan `$backend_fastapi` por eso. Las cinco apuntan al mismo sitio que
# apuntaban —la sustitución es idéntica en los cinco casos, incluidas las dos que llevaban
# `/api/` y `/interes/` al final— y no cambia nada más.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;

server {
    listen 80;
    server_name localhost;

    # Variable a proposito: sin ella nginx resuelve `backend` al arrancar y se queda
    # con la IP para siempre. El porque, entero, arriba del archivo.
    set $backend_fastapi http://backend:8000;

    # No anunciar la versión exacta de nginx en cada respuesta ni en las páginas de error:
    # es información gratuita para quien busca exploits de una versión concreta.
    server_tokens off;

    # Tope de cuerpo de petición. Coincide con el límite del webhook CRM en el backend
    # (256 KiB): sin él, nginx acepta hasta 1 MB por defecto y transporta hasta el
    # backend cuerpos que este va a rechazar de todos modos.
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # --- Cabeceras de seguridad ---
    # Viven en un archivo aparte porque hay que repetirlas en cada `location` que
    # declare sus propias `add_header`: nginx deja de heredar las del padre en cuanto
    # el hijo añade una.
    include /etc/nginx/conf.d/security-headers.conf;

    # --- SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # --- La página pública, servida por el backend (capítulo 27) ---
    # No la sirve la SPA. El HTML tiene que llevar dentro las etiquetas Open Graph y de X de
    # ESA publicación, y quien las lee —LinkedIn, WhatsApp, Facebook, X— descarga el HTML sin
    # ejecutar JavaScript: lo que pusiera el cliente al montarse no lo ve nadie.
    #
    # Va antes de `location /` porque un prefijo más largo gana en nginx, pero se escribe
    # aquí, junto al resto, para que se lea en orden.
    location /interes/ {
        proxy_pass $backend_fastapi;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Igual que en /api/: SOBRESCRIBE. El backend limita por IP leyendo el primer
        # elemento, y añadir al final dejaría que el cliente eligiera su propio contador.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;

        include /etc/nginx/conf.d/security-headers.conf;
    }

    # La entrada de la aplicación lleva nombre fijo (`vite.config.js`) porque el HTML de la
    # página pública la nombra desde el backend, que no conoce las huellas. Sin nombre nuevo
    # en cada despliegue, no puede cachearse para siempre: se revalida.
    location ~ ^/assets/app\.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Los demás assets llevan hash en el nombre, así que se pueden cachear indefinidamente.
    # `max-age` va dentro del propio `add_header` y NO se usa `expires`: cada uno emite su
    # propia cabecera `Cache-Control` y la respuesta salía con las dos, que es justo el
    # caso en que la norma deja de decir cuál gana para un intermediario.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # index.html nunca se cachea: es quien apunta a los assets con hash, y una copia
    # vieja dejaría al usuario pidiendo bundles que ya no existen tras un despliegue.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # --- Pasarela hacia FastAPI ---
    location /api/ {
        proxy_pass $backend_fastapi;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCRIBE, no añade. El backend identifica al cliente por esta cabecera para
        # limitar la tasa por IP, y lee el PRIMER elemento de la cadena.
        #
        # Antes estaba `$proxy_add_x_forwarded_for`, que añade la IP real al FINAL de lo
        # que mandara el cliente: `X-Forwarded-For: <inventada>, <real>`. El primer
        # elemento seguía siendo el que escribía el cliente, así que rotarlo en cada
        # intento daba un contador nuevo por petición y el tope por IP no llegaba a
        # aplicarse nunca —el defecto que N-6 decía cerrar—. Se comprobó midiendo: tres
        # peticiones con `X-Forwarded-For` inventado produjeron tres contadores distintos
        # en Redis. Con `$remote_addr` producen uno solo.
        #
        # Sobrescribir es correcto porque nginx es el proxy MÁS EXTERNO de esta pila: es
        # el puerto publicado, así que no hay cadena anterior legítima que preservar. Si
        # algún día se pone un balanceador delante, esta línea debe volver a
        # `$proxy_add_x_forwarded_for` Y el backend debe pasar a leer el elemento que
        # corresponda a ese salto, no el primero; cambiar solo una de las dos cosas
        # reabre el agujero.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Estas cabeceras eran el mecanismo de identidad antes de implantar JWT. El
        # backend ya no las lee, pero se limpian aquí también: si alguien reintrodujera
        # esa confianza, la petición no llegaría con valores puestos por el cliente.
        proxy_set_header X-User-Email "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Name "";
        proxy_set_header X-Entra-User-Email "";
        proxy_set_header X-Entra-User-Role "";
        proxy_set_header X-Entra-Tenant-Id "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # El scoring ejecuta inferencia y generación de texto: 60 s da margen suficiente.
        proxy_read_timeout 60s;

        # También en las respuestas de la API: `nosniff` evita que un JSON con contenido
        # controlado por el usuario se interprete como HTML si alguien lo abre directo.
        include /etc/nginx/conf.d/security-headers.conf;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        include /etc/nginx/conf.d/security-headers.conf;
    }
}

# ==============================================================================
# LA PUERTA ESTRECHA — lo único que sale a internet (capítulo 34)
# ==============================================================================
# El bloque de arriba (puerto 80) es el panel completo y se publica en la red local. Este
# es otro servidor, en otro puerto, y es el que mira el túnel.
#
# La diferencia no está en unas reglas de más: está en que aquí la lista es **blanca**. El
# `location /` final devuelve 404 y cada ruta publicada se nombra una por una. Escribirlo
# al revés —publicar todo y prohibir `/api/v1/leads`, `/docs`, `/metrics`…— funciona el día
# que se escribe y falla el día que alguien añade un endpoint nuevo, porque lo que no está
# en una lista negra queda publicado por omisión. Aquí, lo que no está queda fuera.
#
# Qué queda publicado, y nada más:
#
#   GET  /interes/<slug>                 el HTML con las etiquetas de la tarjeta
#   GET  /interes/<slug>/tarjeta.png     la imagen 1200x630 de la vista previa
#   GET  /api/v1/interes/<slug>          la publicación y las listas del formulario
#   POST /api/v1/interes/<slug>          el envío del interesado
#   GET  /assets/…                       el bundle que la página necesita para dibujarse
#
# Sobre `/assets/`: es el mismo bundle del panel, así que quien abra la página pública
# puede descargar el JavaScript de la aplicación entera. No es una fuga —es código de
# cliente, sin secretos, y hay una prueba que lo comprueba— y no hay forma de evitarlo sin
# compilar un segundo bundle solo para esta página. Lo que importa es que ese código no
# puede llamar a nada: las rutas de gestión no existen en este servidor.
server {
    listen 8080;
    server_name _;

    # Lo mismo que en el puerto 80, y aqui importa mas: un 502 en esta puerta lo ve
    # quien pulso un enlace publicado, no quien despliega.
    set $backend_fastapi http://backend:8000;
    server_tokens off;

    # El envío público es un formulario de nueve campos cortos. 16 KiB es holgado para eso
    # y tres órdenes de magnitud menos que el tope del panel: por aquí no entra un webhook.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # HTTPS lo termina Cloudflare y el tramo hasta aquí va por el túnel, así que la
    # dirección pública es siempre `https://`. Aquí sí aplica HSTS, al contrario que en el
    # puerto 80, que se sirve en claro dentro de la red local.
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Lo único que existe por esta puerta ---

    # El HTML de la publicación. El rango del slug es el mismo que reconoce la aplicación
    # (`frontend/src/main.jsx`): un enlace que no case aquí tampoco se dibujaría allí.
    location ~ "^/interes/[A-Za-z0-9_-]{6,64}$" {
        limit_req zone=puerta_publica burst=20 nodelay;
        proxy_pass $backend_fastapi;
        include /etc/nginx/conf.d/puerta-publica.conf;
    }

    location ~ "^/interes/[A-Za-z0-9_-]{6,64}/tarjeta\.png$" {
        limit_req zone=puerta_publica burst=20 nodelay;
        proxy_pass $backend_fastapi;
        include /etc/nginx/conf.d/puerta-publica.conf;
    }

    # La API de la página, y SOLO la de la página: `/api/v1/interes/<slug>`. No es un
    # prefijo `/api/` recortado, es esta ruta y ninguna otra.
    location ~ "^/api/v1/interes/[A-Za-z0-9_-]{6,64}$" {
        limit_req zone=puerta_publica burst=20 nodelay;
        proxy_pass $backend_fastapi;
        include /etc/nginx/conf.d/puerta-publica.conf;
    }

    # La misma excepción que arriba, en el servidor del panel, y por el mismo motivo: la
    # entrada de la aplicación lleva nombre fijo, así que no puede cachearse para siempre.
    #
    # Aquí importa más que arriba, y por eso esta copia no es una duplicación que sobre.
    # Por el 80 entra gente de la oficina, que recarga; por aquí entra un desconocido que
    # abrió un enlace de LinkedIn o escaneó un código impreso, y con `immutable` su
    # navegador **no vuelve a preguntar**: se queda con el `app.js` de aquel día durante un
    # año. Cualquier corrección de la página de interés —un texto, una validación, una
    # etiqueta en castellano— no le llega nunca, y no hay forma de saberlo desde aquí.
    #
    # Se encontró recorriendo la demostración el 05-10-2026: tras reconstruir la pila, el
    # panel del 3000 enseñaba el arreglo y la misma página por el 8080 seguía con la lista
    # de sectores en inglés. Recargar no bastaba, que es justo lo que `immutable` promete.
    location ~ ^/assets/app\.(js|css)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Los demás sí llevan huella en el nombre —las fuentes—, así que se cachean indefinidamente.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # --- Todo lo demás ---
    # 404 y no 403: un 403 confirmaría que la ruta existe y simplemente no se sirve por
    # aquí, que es información gratuita sobre la forma del sistema. Desde fuera, el panel,
    # la API de gestión, su documentación y las métricas no existen.
    location / {
        return 404;
    }
}

# ==============================================================================
# Lo que comparten las tres rutas publicadas por la puerta estrecha (capítulo 34)
# ==============================================================================
# Existe por el mismo motivo que `security-headers.conf`: son ocho directivas que hay que
# repetir idénticas en cada `location`, y la que se olvide de una no falla —simplemente
# deja de proteger—. La ruta de la página pública y la de su API son distintas y tienen
# que comportarse igual; con las directivas copiadas a mano, no lo harían por mucho tiempo.

proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header X-Real-IP $ip_publica;

# La IP que verá el backend para contar el límite por IP. `$ip_publica` resuelve a
# `CF-Connecting-IP` cuando la petición entra por el túnel y a `$remote_addr` cuando no
# (véase el `map` del principio de `nginx.conf`, que explica por qué aquí se cree una
# cabecera y en el puerto 80 no).
#
# SOBRESCRIBE, no añade: el backend lee el PRIMER elemento de la cadena, así que
# `$proxy_add_x_forwarded_for` dejaría que el visitante eligiera su propio contador
# poniendo lo que quisiera delante.
proxy_set_header X-Forwarded-For $ip_publica;

# El túnel termina TLS en el borde de Cloudflare, así que hacia fuera el esquema es
# siempre https aunque este salto vaya en claro por la red interna de Docker. Sin esto,
# `$scheme` diría `http` y cualquier dirección que el backend construyera con el esquema
# de la petición saldría rota en la tarjeta de la red social.
proxy_set_header X-Forwarded-Proto https;

# Las cabeceras de identidad anteriores a JWT, limpiadas igual que en el puerto 80: si
# alguien reintrodujera esa confianza, no llegarían con valores puestos desde fuera.
proxy_set_header X-User-Email "";
proxy_set_header X-User-Role "";
proxy_set_header X-User-Name "";
proxy_set_header X-Entra-User-Email "";
proxy_set_header X-Entra-User-Role "";
proxy_set_header X-Entra-Tenant-Id "";

# La página dibuja su imagen al pedirla y el envío recalcula un score: 20 s sobra para las
# dos y corta antes de que una petición colgada ocupe un hueco del servidor.
proxy_connect_timeout 5s;
proxy_send_timeout 20s;
proxy_read_timeout 20s;

include /etc/nginx/conf.d/security-headers.conf;
add_header Strict-Transport-Security "max-age=31536000" always;

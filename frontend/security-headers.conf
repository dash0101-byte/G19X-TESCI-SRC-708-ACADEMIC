# ==============================================================================
# Cabeceras de seguridad — se incluyen en CADA bloque `location` que defina sus
# propias `add_header`.
#
# nginx no hereda las `add_header` del bloque padre en cuanto un bloque hijo declara
# una: al añadir `Cache-Control` en `location = /index.html`, el documento principal de
# la SPA se quedaba sin Content-Security-Policy ni X-Frame-Options. Centralizarlas aquí
# y hacer `include` evita que ese descuido se repita al añadir el siguiente location.
#
# `always` hace que se emitan también en las respuestas de error (4xx/5xx), que es
# justo donde no interesa relajar la política.
# ==============================================================================

# Impide que el navegador adivine el tipo de contenido: corta el vector de servir algo
# "de texto" que el navegador acabe interpretando como script.
add_header X-Content-Type-Options "nosniff" always;

# La aplicación no debe poder embeberse en un iframe ajeno (clickjacking).
add_header X-Frame-Options "DENY" always;

# Limita lo que se envía en el Referer al navegar fuera: los identificadores de
# prospecto viajan en la ruta y no deben filtrarse a terceros.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Desactiva APIs del navegador que esta aplicación no usa.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# `unsafe-inline` en estilos es necesario porque los componentes usan estilos en línea.
# Los scripts, en cambio, quedan restringidos al propio origen: es lo que convierte un
# XSS reflejado en algo inofensivo. `frame-ancestors 'none'` duplica X-Frame-Options
# para navegadores modernos.
#
# `font-src 'self'`, sin `data:`. Las tres familias que la página traía de
# `fonts.googleapis.com` ya se sirven desde este mismo origen (N-7), así que no queda
# ninguna fuente incrustada ni externa que permitir. Mientras estuvo `data:`, esta
# directiva daba una impresión falsa de que la política se cumplía: en realidad la hoja
# de Google se bloqueaba en silencio y la aplicación caía a las fuentes del sistema.
# Ahora la política y lo que la página pide coinciden, y hay una prueba que lo comprueba
# contra el nginx de verdad.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# HSTS queda comentado a propósito: sobre HTTP plano (esta pila se publica en
# http://localhost:3000) no aplica, y activarlo por error en un dominio sin TLS completo
# deja a los usuarios sin acceso durante todo el max-age.
# Descomentar al servir detrás de HTTPS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

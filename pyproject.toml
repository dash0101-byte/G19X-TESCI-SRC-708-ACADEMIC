[tool.pytest.ini_options]
minversion = "8.0"

# Fija el rootdir del proyecto. Sin este archivo, pytest deducía la raíz a partir del
# directorio desde el que se invocaba, así que `pytest` desde `backend/` o desde
# `backend/tests/` fallaba con ModuleNotFoundError: los tests importan tanto `app.*`
# (que vive en backend/) como `ml_pipeline.*` (que vive en la raíz).
# `ml_pipeline/src` entra en la ruta porque las pruebas del bucle de realimentacion
# importan `feedback_dataset` y `synthetic_generator`. Declararlo aqui evita que un
# test funcione solo cuando otro anterior ha manipulado sys.path antes que el.
pythonpath = [".", "backend", "ml_pipeline/src"]
testpaths = ["backend/tests"]

addopts = "--strict-markers --strict-config"

# pytest-asyncio en modo estricto: las corrutinas de test se marcan explícitamente.
# En modo automático, un `async def test_` sin marcar se recolecta y se omite en
# silencio, que es la peor forma de perder cobertura.
asyncio_mode = "strict"

filterwarnings = [
    "error::DeprecationWarning:app.*",
    "error::DeprecationWarning:ml_pipeline.*",
]


[tool.ruff]
# El frontend, los artefactos compilados y las dependencias no se analizan.
extend-exclude = ["frontend", "docs", ".venv", "venv"]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: errores de formato
    "F",    # pyflakes: nombres sin definir, imports y variables sin usar
    "W",    # pycodestyle: avisos
    "I",    # isort: orden de imports
    "B",    # flake8-bugbear: fallos lógicos frecuentes
    "S",    # flake8-bandit: patrones inseguros
    "C4",   # comprensiones innecesarias
]
# `UP` (pyupgrade) queda fuera a propósito: reescribe `Optional[X]` como `X | None` y
# `Dict` como `dict` en más de doscientos puntos del código. Es un cambio de estilo que
# no detecta ningún defecto, y meterlo en la misma tanda que las correcciones reales
# haría ilegible la revisión. Se puede activar por separado cuando se decida modernizar.
ignore = [
    "E501",  # La longitud de línea la gobierna `line-length`, no el linter de estilo
    "B008",  # `Depends(...)` en valores por defecto es el idioma de FastAPI
    "S104",  # El bind a 0.0.0.0 es deliberado dentro del contenedor
]

[tool.ruff.lint.per-file-ignores]
# Las pruebas usan `assert` (S101) por definición y contienen credenciales de prueba
# (S105/S106) que son literales inventados, no secretos reales.
"backend/tests/*" = ["S101", "S105", "S106", "S311"]
# El generador sintético usa `random` para datos de entrenamiento, no para criptografía.
"ml_pipeline/*" = ["S311"]
"scripts/*" = ["S311", "T201"]
# Las pruebas que acompañan a un script son pruebas: `assert` es su forma de expresarse.
"scripts/test_*.py" = ["S101", "S311", "T201"]
"backend/scripts/*" = ["S311", "T201"]

[tool.coverage.run]
# Medicion por ramas, y declarada aqui y no como bandera del CI a proposito. Hasta el
# 7 de octubre de 2026 la cobertura contaba solo sentencias: los documentos decian 94 %
# cuando la cifra con ramas es 92,64 %, porque habia 214 ramas a medio recorrer que
# ningun numero nombraba. Puesta en el pyproject, una medicion local mide exactamente lo
# que mide el CI; puesta como `--cov-branch` en el flujo de trabajo serian dos
# declaraciones de lo mismo, y dos numeros para lo mismo se desincronizan.
branch = true

[tool.coverage.report]
# Dos decimales porque la diferencia entre «92,64» y «93» es justo la que decide si un
# suelo pegado a lo medido es un trinquete o un sello de goma.
precision = 2

# Los quince `__repr__` de `models/entities.py` -dieciseis lineas, el 95,7 % de lo que le
# faltaba a ese archivo- no se prueban: se excluyen. Un `__repr__` existe para que una traza
# y una sesion interactiva se lean, y una prueba que compare su cadena con la misma cadena
# escrita a mano no comprueba nada; lo unico que consigue es que cambiar el texto de una
# traza ponga la suite en rojo. Si alguno dejara de ser solo una cadena -si calculara algo o
# consultara la base- esta exclusion dejaria de valer, y entonces hay que probarlo.
#
# Va como UNA regla aqui y no como quince marcas repartidas por el modelo, por lo mismo que
# el resto de este repositorio: una regla se escribe una vez, y quince sitios son quince
# donde el siguiente se olvida. Ademas el control de marcas del trabajo
# `configuracion-peligrosa` cuenta `pragma`, asi que quince habrian inflado su trinquete con
# algo que no es una decision por archivo.
#
# Y los cuerpos de los metodos abstractos de `adapters/base.py`: cuatro `pass` que no se
# ejecutan nunca porque cada subclase los sustituye. Instanciar la clase abstracta para
# recorrerlos no se puede -`ABC` lo impide- y llamarlos con `super()` seria escribir una
# prueba cuyo unico sujeto es la palabra `pass`. Lo que SI se prueba de ese archivo es
# `version_del_motor`, que tiene cuerpo de verdad y una razon para tenerlo.
exclude_also = ["def __repr__", "@(abc\\.)?abstractmethod"]
